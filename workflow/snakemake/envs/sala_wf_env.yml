name: sala_wf
channels:
  - chungchauhon
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - pip
  - bedtools >=2.31.1,<3.0a0
  - htslib >=1.21,<1.22.0a0
  - paraclu >=10,<11.0a0
  - perl
  - htslib
  - r-base 4.2.3
  - icu=70.* #to address issue in cluster filter
  - r-stringi=1.7.8
  - r-caret
  - r-docopt
  - r-e1071
  - r-ggplot2
  - r-lifecycle 1.0.4.*
  - r-prroc
  - r-r.utils
  - r-reshape2
  - r-rocr
  - r-scales
  - r-data.table
  - r-magrittr
  - r-stringr
  - bioconductor-rsamtools
  - r-biocmanager
  - samtools >=1.21,<2.0a0
  - scafe=1.0.2
  - ucsc-bedgraphtobigwig >=481
  - ucsc-bigwigaverageoverbed >=469
  - setuptools==81.0.0 #for bedparse pkg_resources
  - pip:
    - bedparse
    - CPAT
prefix: sala_wf